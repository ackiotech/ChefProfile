<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1108"/>
      <stop offset="100%" style="stop-color:#2C1A08"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8891A"/>
      <stop offset="50%" style="stop-color:#C1410C"/>
      <stop offset="100%" style="stop-color:#E8891A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="#E8891A" stroke-width="1" opacity="0.3"/>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>

  <!-- Outer spice ring -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>

  <!-- Inner decorative ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#E8891A" stroke-width="0.8"
          stroke-dasharray="8,5" opacity="0.5"/>

  <!-- Spice icon — stylised wok with steam (centre top) -->
  <g transform="translate(200, 120)" filter="url(#glow)">
    <!-- Wok body -->
    <path d="M-45,0 Q-50,35 0,42 Q50,35 45,0 Z"
          fill="none" stroke="#E8891A" stroke-width="2.5"/>
    <!-- Wok handles -->
    <line x1="-45" y1="10" x2="-62" y2="10" stroke="#E8891A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="10" x2="62" y2="10" stroke="#E8891A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wok flat base hint -->
    <line x1="-18" y1="40" x2="18" y2="40" stroke="#E8891A" stroke-width="2" opacity="0.6"/>
    <!-- Steam curls -->
    <path d="M-18,-12 Q-12,-26 -18,-38" fill="none" stroke="#C1410C" stroke-width="2"
          stroke-linecap="round" opacity="0.8"/>
    <path d="M0,-8 Q8,-24 0,-38" fill="none" stroke="#E8891A" stroke-width="2.2"
          stroke-linecap="round" opacity="0.9"/>
    <path d="M18,-12 Q24,-26 18,-38" fill="none" stroke="#C1410C" stroke-width="2"
          stroke-linecap="round" opacity="0.8"/>
    <!-- Spice dots in wok -->
    <circle cx="-14" cy="24" r="3" fill="#C1410C" opacity="0.7"/>
    <circle cx="0" cy="28" r="3.5" fill="#E8891A" opacity="0.8"/>
    <circle cx="14" cy="24" r="3" fill="#C1410C" opacity="0.7"/>
    <circle cx="-7" cy="15" r="2.5" fill="#E8891A" opacity="0.6"/>
    <circle cx="7" cy="15" r="2.5" fill="#C1410C" opacity="0.6"/>
  </g>

  <!-- Initials "SR" in large display -->
  <text x="200" y="232" text-anchor="middle"
        font-family="Georgia, serif" font-size="68" font-weight="bold"
        letter-spacing="8" fill="#F9F4EB" filter="url(#shadow)">SR</text>

  <!-- Divider rule -->
  <line x1="100" y1="248" x2="300" y2="248" stroke="url(#ringGrad)" stroke-width="1.5"/>
  <text x="200" y="244" text-anchor="middle" font-size="10" fill="#E8891A">✦</text>

  <!-- Instagram handle — curved text approximated with straight -->
  <text x="200" y="272" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="14" font-weight="bold"
        letter-spacing="1.5" fill="#E8891A">@sathyacannotcook</text>

  <!-- Tagline -->
  <text x="200" y="298" text-anchor="middle"
        font-family="Georgia, serif" font-size="11" font-style="italic"
        letter-spacing="3" fill="#8A7254">CHEF · STORYTELLER · CREATOR</text>

  <!-- Bottom spice ornament dots -->
  <circle cx="130" cy="322" r="2.5" fill="#C1410C" opacity="0.5"/>
  <circle cx="145" cy="318" r="1.8" fill="#E8891A" opacity="0.4"/>
  <circle cx="200" cy="325" r="3" fill="#E8891A" opacity="0.6"/>
  <circle cx="255" cy="318" r="1.8" fill="#E8891A" opacity="0.4"/>
  <circle cx="270" cy="322" r="2.5" fill="#C1410C" opacity="0.5"/>

  <!-- Outer fine ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#2D694F" stroke-width="1" opacity="0.4"/>
</svg>